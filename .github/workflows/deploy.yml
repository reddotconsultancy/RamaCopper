name: Deploy to cPanel

# Every push to main uploads the site to the hosting over FTPS.
# Only changed files are sent: the action keeps a sync state file on the server.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Folder on the server to deploy into, relative to public_html"
        required: true
        default: "_newsite/"

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4.2.2

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ github.event.inputs.target || '_newsite/' }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/tools/**
            **/node_modules/**
            **/README.md
            **/vercel.json
